# Adds SHA256SUMS.txt to a release so users can verify their downloads.
# Runs automatically when a release is published. Can also be run by hand
# from the Actions tab for an existing release tag.
name: Release checksums

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to checksum (for example v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS.txt

      - name: Compute checksums
        run: |
          cd assets
          if [ -z "$(ls -A)" ]; then
            echo "No assets attached to this release." >&2
            exit 1
          fi
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
